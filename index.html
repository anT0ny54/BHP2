<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandwidth Hero Proxy</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(640px, 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      color: #f0f6fc;
    }

    code {
      display: block;
      margin: 8px 0;
      padding: 10px;
      overflow-wrap: anywhere;
      background: #0d1117;
      border-radius: 6px;
      color: #ff7b72;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      background: #1f6feb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #30363d;
    }

    .ok {
      color: #56d364;
    }

    .fail {
      color: #f85149;
    }

    .pending {
      color: #8b949e;
    }

    .metric {
      color: #8b949e;
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <main>
    <h1>⚡ Bandwidth Hero Proxy</h1>

    <p>
      Configure your extension with this proxy URL:
    </p>

    <code id="proxy-url"></code>

    <button id="diagnostics-button">
      Run diagnostics
    </button>

    <ul>
      <li>
        <span>
          Proxy reachable
          <div class="metric" id="reachable-metric"></div>
        </span>
        <strong class="pending" id="reachable-status">Pending</strong>
      </li>

      <li>
        <span>
          CORS enabled
          <div class="metric" id="cors-metric"></div>
        </span>
        <strong class="pending" id="cors-status">Pending</strong>
      </li>

      <li>
        <span>
          Image compression
          <div class="metric" id="compression-metric"></div>
        </span>
        <strong class="pending" id="compression-status">Pending</strong>
      </li>

      <li>
        <span>
          Caching headers
          <div class="metric" id="cache-metric"></div>
        </span>
        <strong class="pending" id="cache-status">Pending</strong>
      </li>
    </ul>
  </main>

  <script>
    const proxyPath = "/api/index";
    const proxyUrl = `${window.location.origin}${proxyPath}`;

    document.getElementById("proxy-url").textContent = proxyUrl;

    const button = document.getElementById("diagnostics-button");

    function setStatus(id, passed, text) {
      const element = document.getElementById(id);

      element.textContent = passed ? "Passed" : "Failed";
      element.className = passed ? "ok" : "fail";

      if (text) {
        document.getElementById(
          id.replace("-status", "-metric")
        ).textContent = text;
      }
    }

    function resetStatuses() {
      for (const id of [
        "reachable-status",
        "cors-status",
        "compression-status",
        "cache-status"
      ]) {
        const element = document.getElementById(id);
        element.textContent = "Pending";
        element.className = "pending";
      }

      document.getElementById("reachable-metric").textContent = "";
      document.getElementById("cors-metric").textContent = "";
      document.getElementById("compression-metric").textContent = "";
      document.getElementById("cache-metric").textContent = "";
    }

    async function runDiagnostics() {
      resetStatuses();
      button.disabled = true;
      button.textContent = "Running...";

      try {
        const healthResponse = await fetch("/api/health");
        const healthData = await healthResponse.json();

        const healthPassed =
          healthResponse.status === 200 &&
          healthData.status === "ok";

        setStatus(
          "reachable-status",
          healthPassed,
          healthPassed
            ? "Health endpoint returned status: ok"
            : "Health endpoint returned an invalid response"
        );

        if (!healthPassed) {
          setStatus(
            "cors-status",
            false,
            "The health endpoint did not pass"
          );
          return;
        }

        const handshakeResponse = await fetch(proxyPath);
        const handshake = await handshakeResponse.text();

        const corsPassed =
          handshakeResponse.status === 200 &&
          handshake === "bandwidth-hero-proxy" &&
          handshakeResponse.headers.get(
            "access-control-allow-origin"
          ) === "*";

        setStatus(
          "cors-status",
          corsPassed,
          corsPassed
            ? "CORS and handshake verified"
            : "CORS or handshake verification failed"
        );

        const testImage =
          "https://avatars.githubusercontent.com/u/9919";

        const start = Date.now();

        const imageResponse = await fetch(
          `${proxyPath}?url=${encodeURIComponent(testImage)}`
        );

        const elapsed = Date.now() - start;
        const contentType =
          imageResponse.headers.get("content-type") || "";

        const originalSize = Number(
          imageResponse.headers.get("x-bh-original-size") || 0
        );

        const bytesSaved = Number(
          imageResponse.headers.get("x-bh-bytes-saved") || 0
        );

        const compressionPassed =
          imageResponse.status === 200 &&
          contentType.startsWith("image/") &&
          originalSize > 0;

        const percentage = originalSize
          ? ((bytesSaved / originalSize) * 100).toFixed(1)
          : "0.0";

        setStatus(
          "compression-status",
          compressionPassed,
          compressionPassed
            ? `${contentType}, ${elapsed} ms, saved ${percentage}%`
            : "Compression request failed"
        );

        const cacheControl =
          imageResponse.headers.get("cache-control") || "";

        const cachePassed =
          cacheControl.length > 0 &&
          cacheControl.startsWith("public,");

        setStatus(
          "cache-status",
          cachePassed,
          cachePassed
            ? `Cache-Control: ${cacheControl}`
            : "Cache-Control header missing or invalid"
        );
      } catch (error) {
        setStatus(
          "reachable-status",
          false,
          "Could not connect to the health endpoint"
        );

        setStatus(
          "cors-status",
          false,
          "Diagnostics stopped"
        );

        setStatus(
          "compression-status",
          false,
          "Diagnostics stopped"
        );

        setStatus(
          "cache-status",
          false,
          "Diagnostics stopped"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Run diagnostics again";
      }
    }

    button.addEventListener("click", runDiagnostics);
  </script>
</body>
</html>
