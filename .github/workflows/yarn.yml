name: Generate yarn.lock

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/github_workflows_generate-yarn-lock.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # weekly run (UTC)

permissions:
  contents: write

concurrency:
  group: generate-yarn-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'
          cache: 'yarn'

      - name: Enable Corepack and prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Install dependencies (generate yarn.lock)
        run: yarn install

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Check for changes in yarn.lock
        id: changes
        run: |
          git add yarn.lock || true
          if git diff --cached --quiet --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit yarn.lock if changed
        if: steps.changes.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: chore: update yarn.lock (generated by workflow)
          add: 'yarn.lock'
          push: true
          token: ${{ secrets.GITHUB_TOKEN }}
