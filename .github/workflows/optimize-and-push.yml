name: Optimize and Push Repository

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-main
  cancel-in-progress: true

jobs:
  optimize-and-push:
    runs-on: ubuntu-latest

    # Prevent the workflow from running repeatedly on its own optimization commit.
    if: "!contains(github.event.head_commit.message, '[skip optimize]')"

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make optimization script executable
        run: chmod +x build-optimized.sh

      - name: Run build-optimized.sh
        run: ./build-optimized.sh

      - name: Copy optimized files into the actual repository
        run: |
          set -e

          SOURCE_DIR="bhp2-optimized"

          test -d "$SOURCE_DIR"

          mkdir -p functions util

          cp "$SOURCE_DIR/functions/index.js" functions/index.js
          cp "$SOURCE_DIR/functions/health.js" functions/health.js

          cp "$SOURCE_DIR/util/compress.js" util/compress.js
          cp "$SOURCE_DIR/util/validate.js" util/validate.js
          cp "$SOURCE_DIR/util/fetch.js" util/fetch.js

          cp "$SOURCE_DIR/netlify.toml" netlify.toml
          cp "$SOURCE_DIR/index.html" index.html

      - name: Verify dependency files were not modified
        run: |
          if git diff --quiet -- package.json yarn.lock; then
            echo "package.json and yarn.lock were not modified."
          else
            echo "ERROR: package.json or yarn.lock was modified."
            git diff -- package.json yarn.lock
            exit 1
          fi

      - name: Show changed files
        run: git status --short

      - name: Commit optimized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            functions/index.js \
            functions/health.js \
            util/compress.js \
            util/validate.js \
            util/fetch.js \
            netlify.toml \
            index.html

          if git diff --cached --quiet; then
            echo "No optimized files changed."
            exit 0
          fi

          git commit -m "Optimize Bandwidth Hero deployment [skip optimize]"
          git push origin HEAD:main
