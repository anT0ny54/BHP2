name: Optimize and Deploy Bandwidth Hero

on:
  push:
    branches:
      - main

  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bandwidth-hero-production
  cancel-in-progress: true

jobs:
  optimize:
    name: Build optimized repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make script executable
        run: chmod +x ./build-optimized.sh

      - name: Run optimization script
        run: ./build-optimized.sh

      - name: Upload optimized ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bhp2-optimized
          path: |
            bhp2-optimized.zip
            bhp2-optimized.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized source
        uses: actions/upload-artifact@v4
        with:
          name: bhp2-optimized-source
          path: bhp2-optimized
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Netlify
    needs: optimize
    runs-on: ubuntu-latest

    # Pull requests only build and archive the project.
    # Production deployment happens only after a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download optimized source
        uses: actions/download-artifact@v4
        with:
          name: bhp2-optimized
          path: artifacts

      - name: Extract optimized source
        run: |
          mkdir -p deploy
          tar -xzf artifacts/bhp2-optimized.tar.gz
          cp -R bhp2-optimized/. deploy/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: deploy/yarn.lock

      - name: Install dependencies
        working-directory: deploy
        run: yarn install --frozen-lockfile

      - name: Deploy optimized project to Netlify
        working-directory: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy \
            --prod \
            --dir=. \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN"
