name: Update Yarn lockfile

on:
  workflow_dispatch:
  push:
    paths:
      - package.json

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    # Optional: use Node.js 24 for JavaScript actions immediately
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Regenerate yarn.lock
        run: yarn install --ignore-scripts --non-interactive

      - name: Create pull request if lockfile changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update Yarn lockfile
          title: Update Yarn lockfile
          body: |
            Regenerated yarn.lock to match package.json.
          branch: automated/update-yarn-lockfile
          delete-branch: true
